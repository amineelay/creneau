@font-face{font-family:"Barlow Condensed";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-500.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}

<style>
/* Layout: one-column phone app, fixed tab bar at the bottom, live-session mode takes the whole screen */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#141820; --muted:#5D6572; --line:#DDE1E8;
  --accent:#2F55E0; --accent-ink:#FFFFFF; --accent-soft:#E4EAFF;
  --signal:#C98A00; --signal-soft:#FFF3D6; --good:#1F8A4C; --good-soft:#DDF3E5; --warn:#B4401F;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#161A22; --ink:#E7EAF0; --muted:#98A1AE; --line:#272D38;
  --accent:#7D98FF; --accent-ink:#0D1015; --accent-soft:#1D2540;
  --signal:#F2B83A; --signal-soft:#2E2610; --good:#4FC283; --good-soft:#12291C; --warn:#F08A6A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161A22; --ink:#E7EAF0; --muted:#98A1AE; --line:#272D38;
  --accent:#7D98FF; --accent-ink:#0D1015; --accent-soft:#1D2540;
  --signal:#F2B83A; --signal-soft:#2E2610; --good:#4FC283; --good-soft:#12291C; --warn:#F08A6A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 96px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{width:100%;padding:15px;font-size:17px;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
textarea,input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{min-height:60px;resize:vertical}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:4px}
.slot{font-family:var(--f-num);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px;white-space:nowrap}

/* plan */
.block{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.block:first-child{border-top:0;padding-top:2px}
.bmark{font-family:var(--f-display);font-weight:700;font-size:13px;text-align:center;border-radius:8px;padding:6px 0;background:var(--accent-soft);color:var(--accent);line-height:1.1}
.bmark b{display:block;font-size:20px}
.bmark.run{background:var(--signal-soft);color:var(--signal)}
.pair{display:flex;flex-direction:column;gap:6px;min-width:0}
.ex{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .n{font-weight:600}
.ex .t{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;border-radius:5px;padding:2px 6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.kg{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.up{background:var(--good-soft);color:var(--good);border-color:transparent}
.note{border-left:3px solid var(--signal);background:var(--signal-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.ai{border-left-color:var(--accent);background:var(--accent-soft)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:12px 4px 10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}

/* week grid */
.grid{display:grid;grid-template-columns:52px repeat(7,1fr);gap:4px;font-size:11px}
.grid .h{color:var(--muted);text-align:center;font-weight:600}
.grid .wk{color:var(--muted);font-family:var(--f-num);font-size:10px;align-self:center}
.cell{aspect-ratio:1;max-width:100%;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.cell.plan{border-style:dashed;border-color:var(--muted)}
.cell.done{background:var(--accent);border-color:var(--accent)}
.cell.today{outline:2px solid var(--signal);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hist .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hist .it:first-child{border-top:0}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.trend{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.trend:first-of-type{border-top:0}
.trend .v{font-family:var(--f-num);font-size:13px;color:var(--muted);margin-top:2px}
.trend .v b{color:var(--ink)}
.spark{width:96px;height:30px;display:block;overflow:visible}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}
.spark rect{fill:var(--accent)}
.spark rect.cur{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.spark line{stroke:var(--line);stroke-width:1}
.tform{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}

/* live */
.live{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.live .wrap{padding-block:12px 24px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stage .what{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.02}
.stage .big{font-family:var(--f-num);font-size:56px;line-height:1;text-align:center}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper button{height:56px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:26px;font-weight:600}
.stepper .v{text-align:center;font-family:var(--f-num);font-size:40px}
.stepper .u{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.next{font-size:14px;color:var(--muted)}
.next b{color:var(--ink)}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.anchor{display:inline-flex;align-items:center;gap:5px}
.anchor svg{width:14px;height:14px}
/* illustrations */
.ill{width:100%;height:auto;display:block}
.ill .fl{stroke:var(--line);stroke-width:1}
.ill .near{stroke:var(--ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ill .far{stroke:var(--muted);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.ill .head{fill:var(--ink)}
.ill .prop{fill:var(--line);stroke:var(--muted);stroke-width:.8}
.ill .propl{stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.ill .mat{fill:var(--accent-soft)}
.ill .db{fill:var(--accent)}
.ill .band{stroke:var(--signal);stroke-width:1.6;stroke-dasharray:3 1.6}
.ill .anc{fill:var(--muted)}
.ill .anc.on{fill:var(--signal)}
.exw{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center}
.exw>div{min-width:0}
.thumb{background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hero-ill{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:420px;width:100%;margin:0 auto}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- Catalogue (équipement d'Amine) ----------
// eq: db = haltères réglables 2–24 kg, band = Smartworkout (ancrage haut / milieu / bas), bw = poids du corps / tapis
const EX = {
  dc:{n:"Développé couché haltères",eq:"db",p:"push",tier:"H",r:[8,12],z:["epaule"],cue:"Omoplates serrées, descente 2 s."},
  dci:{n:"Développé incliné haltères",eq:"db",p:"push",tier:"M",r:[8,12],z:["epaule"],cue:"Banc à 30°, coudes à 45°."},
  dm:{n:"Développé militaire assis",eq:"db",p:"push",tier:"M",r:[8,12],z:["epaule"],cue:"Dossier droit, gainage serré."},
  row:{n:"Rowing un bras appui banc",eq:"db",p:"pull",tier:"H",r:[10,12],z:[],uni:1,cue:"Tire le coude vers la hanche."},
  gs:{n:"Goblet squat",eq:"db",p:"legs",tier:"H",r:[10,15],z:["genou"],cue:"Un haltère tenu vertical, talons au sol."},
  rdl:{n:"Soulevé de terre roumain",eq:"db",p:"hinge",tier:"H",r:[10,12],z:["dos"],cue:"Hanches en arrière, dos plat."},
  fa:{n:"Fentes arrière",eq:"db",p:"legs",tier:"M",r:[8,10],z:["genou"],uni:1,cue:"Genou arrière frôle le sol."},
  bul:{n:"Split squat bulgare",eq:"db",p:"legs",tier:"M",r:[8,10],z:["genou"],uni:1,cue:"Pied arrière sur le banc."},
  ht:{n:"Hip thrust haltère",eq:"db",p:"hinge",tier:"H",r:[10,15],z:[],cue:"Dos sur le banc, pause 1 s en haut."},
  el:{n:"Élévations latérales",eq:"db",p:"shoulder",tier:"L",r:[12,15],z:["epaule"],cue:"Monte jusqu'aux épaules, pas plus."},
  curl:{n:"Curl marteau",eq:"db",p:"arms",tier:"L",r:[10,12],z:["coude"],cue:"Coudes fixes."},
  ext:{n:"Extension triceps couché",eq:"db",p:"arms",tier:"L",r:[10,12],z:["coude"],cue:"Sur le banc, coudes vers le plafond."},
  tva:{n:"Tirage vertical à genoux",eq:"band",a:"haut",p:"pull",r:[12,15],z:["epaule"],cue:"Coudes vers les côtes."},
  tri:{n:"Extension triceps poulie haute",eq:"band",a:"haut",p:"arms",r:[12,15],z:["coude"],cue:"Coudes collés au corps."},
  fp:{n:"Face pull",eq:"band",a:"haut",p:"pull",r:[15,20],z:[],cue:"Mains vers les tempes, coudes hauts."},
  rd:{n:"Rowing debout bras écartés",eq:"band",a:"milieu",p:"pull",r:[12,15],z:[],cue:"Deux fixations mi-hauteur."},
  pal:{n:"Pallof press",eq:"band",a:"milieu",p:"core",r:[10,12],z:[],uni:1,cue:"Résiste à la rotation."},
  ta:{n:"Tirage horizontal assis",eq:"band",a:"bas",p:"pull",r:[12,15],z:[],cue:"Assis sur le tapis, buste droit."},
  pt:{n:"Pull-through",eq:"band",a:"bas",p:"hinge",r:[12,15],z:["dos"],cue:"Pousse les hanches vers l'avant."},
  ce:{n:"Curl élastique",eq:"band",a:"bas",p:"arms",r:[12,15],z:["coude"],cue:"Contrôle la descente."},
  pompes:{n:"Pompes",eq:"bw",p:"push",r:[8,15],z:["poignet","epaule"],cue:"Corps gainé, poitrine au sol."},
  planche:{n:"Planche",eq:"bw",p:"core",hold:40,z:[],cue:"Bassin neutre."},
  deadbug:{n:"Dead bug",eq:"bw",p:"core",r:[10,12],z:[],cue:"Lombaires plaquées au tapis."},
  glat:{n:"Gainage latéral",eq:"bw",p:"core",hold:30,z:["epaule"],uni:1,cue:"30 s par côté."},
  pont:{n:"Pont fessier unilatéral",eq:"bw",p:"hinge",r:[10,12],z:[],uni:1,cue:"Pousse dans le talon."},
  // haut du corps (force)
  pullover:{n:"Pullover haltère",eq:"db",p:"pull",tier:"M",r:[10,12],z:["epaule"],cue:"Un haltère à deux mains, bras quasi tendus, descente derrière la tête."},
  arnold:{n:"Arnold press",eq:"db",p:"push",tier:"M",r:[8,12],z:["epaule"],cue:"Paumes vers toi en bas, rotation en montant."},
  renegade:{n:"Rowing renegade",eq:"db",p:"pull",tier:"L",r:[8,10],z:["poignet"],uni:1,cue:"Planche sur les haltères, rowing sans tourner le bassin."},
  presseel:{n:"Développé élastique en fente",eq:"band",a:"milieu",p:"push",r:[10,12],z:["epaule"],cue:"Dos au mur, pousse devant toi en gainant."},
  rowel:{n:"Rowing élastique un bras",eq:"band",a:"milieu",p:"pull",r:[10,12],z:[],uni:1,cue:"Pieds décalés, coude qui passe derrière le buste."},
  pdecl:{n:"Pompes déclinées",eq:"bw",p:"push",r:[8,12],z:["poignet","epaule"],cue:"Pieds sur le banc, corps gainé."},
  dips:{n:"Dips sur banc",eq:"bw",p:"push",r:[10,15],z:["epaule"],cue:"Mains au bord du banc, coudes vers l'arrière."},
  // dynamiques, plusieurs muscles à la fois
  thruster:{n:"Thruster",eq:"db",p:"dyn",tier:"M",r:[8,12],z:["genou","epaule"],cue:"Squat puis développé dans le même élan."},
  cleanpress:{n:"Épaulé-développé",eq:"db",p:"dyn",tier:"M",r:[6,10],z:["dos","epaule"],cue:"Haltères des genoux aux épaules, puis au-dessus de la tête."},
  manmaker:{n:"Man maker",eq:"db",p:"dyn",tier:"L",r:[5,8],z:["poignet","epaule","dos"],cue:"Pompe sur haltères, rowing de chaque bras, pieds aux mains, épaulé-développé."},
  swing:{n:"Swing haltère",eq:"db",p:"dyn",tier:"H",r:[15,20],z:["dos"],cue:"Un haltère à deux mains, la poussée vient des hanches."},
  snatch:{n:"Arraché un bras",eq:"db",p:"dyn",tier:"M",r:[6,8],z:["epaule","dos"],uni:1,cue:"Du sol au-dessus de la tête en un seul mouvement."},
  fenterot:{n:"Fente avant + rotation",eq:"db",p:"dyn",tier:"L",r:[8,10],z:["genou"],uni:1,cue:"Haltère à deux mains, buste tourné vers la jambe avant."},
  stepup:{n:"Step-up sur banc",eq:"db",p:"legs",tier:"M",r:[8,10],z:["genou"],uni:1,cue:"Pousse dans le talon posé sur le banc."},
  sqrow:{n:"Squat + tirage élastique",eq:"band",a:"milieu",p:"dyn",r:[12,15],z:["genou"],cue:"Face au mur, tire en remontant du squat."},
  burpee:{n:"Burpees",eq:"bw",p:"dyn",r:[8,12],z:["poignet","genou"],cue:"Planche, pieds aux mains, saut bras tendus."},
  spider:{n:"Pompes spiderman",eq:"bw",p:"push",r:[6,10],z:["poignet"],cue:"Genou vers le coude à chaque descente, alterne."},
  bear:{n:"Bear crawl",eq:"bw",p:"dyn",hold:30,z:["poignet"],cue:"Genoux à 2 cm du sol, avance bras et jambe opposés."},
};
const ZONES = {epaule:"Épaule",coude:"Coude",poignet:"Poignet",dos:"Lombaires",genou:"Genou"};

// Chaque bloc = un duo enchaîné sans repos. Règle : au plus UN exercice haltères par duo,
// donc on ne règle les haltères qu'entre deux blocs.
const TPL = {
  haut_a:{t:"Haut · Poussée",rounds:4,blocks:[[["dc","ta"],["dci","rd"],["dc","rowel"]],[["dm","tva"],["arnold","tva"],["dm","fp"]],[["ext","pdecl"],["el","dips"],["ext","fp"]]]},
  dyn:{t:"Full body dynamique",rounds:4,fin:true,blocks:[[["thruster","rowel"],["cleanpress","sqrow"],["snatch","rowel"]],[["renegade","burpee"],["manmaker","bear"],["renegade","spider"]],[["swing","presseel"],["fenterot","presseel"],["swing","spider"]]]},
  haut_b:{t:"Haut · Tirage",rounds:4,blocks:[[["row","pompes"],["row","pdecl"],["renegade","tva"]],[["pullover","fp"],["dci","rd"],["pullover","rowel"]],[["curl","tri"],["el","ce"],["curl","dips"]]]},
  mix:{t:"Haut + entretien bas",rounds:4,blocks:[[["gs","pal"],["bul","pal"],["stepup","pal"]],[["rdl","pompes"],["ht","pdecl"],["swing","pompes"]],[["dm","rd"],["arnold","fp"],["dci","ta"]]]},
  bas:{t:"Bas + gainage",rounds:4,blocks:[[["gs","pal"],["bul","pal"]],[["rdl","deadbug"],["ht","deadbug"]],[["fa","glat"],["stepup","planche"]]]},
  cardio:{t:"Tapis fractionné",rounds:3,run:true,blocks:[[["ht","planche"],["swing","bear"]]]},

const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
function fillPose(o){const r={...o}; for(const k of ["e","w","k","f"]) if(!r[k+"2"]) r[k+"2"]=r[k]; return r;}
function illus(id){
  const P=POSE[id]; if(!P) return "";
  const A=fillPose(P.a), B=fillPose({...P.a,...P.b});
  const dur=(P.dur||2.6)+"s";
  const off=P.front?0:2; // décale le membre éloigné pour qu'il reste lisible de profil
  const sh=(pt,far)=>far&&off?[pt[0]+off,pt[1]-1]:pt;
  const an=(attr,a,b)=>RM||a===b?"":`<animate attributeName="${attr}" values="${a};${b};${a}" dur="${dur}" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>`;
  const pts=(F,keys,far)=>keys.map(k=>sh(F[k],far&&k!=="n"&&k!=="p").join(",")).join(" ");
  const line=(keys,cls,far)=>{const a=pts(A,keys,far),b=pts(B,keys,far);return `<polyline class="${cls}" points="${a}">${an("points",a,b)}</polyline>`;};
  let s="";
  s+=`<line class="fl" x1="0" y1="72.5" x2="120" y2="72.5"/>`;
  (P.props||[]).forEach(pr=>{
    if(pr[0]==="bench"){const[,x1,x2,y]=pr;s+=`<line class="propl" x1="${x1+3}" y1="${y}" x2="${x1+3}" y2="72"/><line class="propl" x1="${x2-3}" y1="${y}" x2="${x2-3}" y2="72"/><rect class="prop" x="${x1}" y="${y}" width="${x2-x1}" height="4" rx="1.5"/>`;}
    if(pr[0]==="line"){const[,x1,y1,x2,y2]=pr;s+=`<line class="propl" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke-width:4"/>`;}
    if(pr[0]==="mat"){s+=`<rect class="mat" x="${pr[1]}" y="70.5" width="${pr[2]-pr[1]}" height="2" rx="1"/>`;}
    if(pr[0]==="tread"){s+=`<path class="prop" d="M28 65 L90 62 L92 68 L30 71 Z"/><line class="propl" x1="88" y1="63" x2="82" y2="26"/><rect class="prop" x="74" y="20" width="14" height="7" rx="1.5"/><line class="propl" x1="82" y1="34" x2="68" y2="35" style="stroke-width:2"/>`;}
  });
  if(P.band){
    const ys={haut:10,milieu:38,bas:66};
    s+=`<rect class="prop" x="0" y="4" width="5" height="68" style="stroke:none"/>`;
    for(const k in ys) s+=`<circle class="anc ${k===P.band?"on":""}" cx="5" cy="${ys[k]}" r="${k===P.band?2.6:1.8}"/>`;
    const y=ys[P.band];
    [["w",0],["w2",1]].forEach(([k,far])=>{const a=sh(A[k],far),b=sh(B[k],far);
      s+=`<line class="band" x1="5" y1="${y}" x2="${a[0]}" y2="${a[1]}">${an("x2",a[0],b[0])}${an("y2",a[1],b[1])}</line>`;});
  }
  s+=line(["n","e2","w2"],"far",1)+line(["p","k2","f2"],"far",1);
  s+=line(["h","n","p"],"near",0)+line(["p","k","f"],"near",0)+line(["n","e","w"],"near",0);
  s+=`<circle class="head" cx="${A.h[0]}" cy="${A.h[1]}" r="5">${an("cx",A.h[0],B.h[0])}${an("cy",A.h[1],B.h[1])}</circle>`;
  const dbAt=(k,far)=>{const a=sh(A[k],far),b=sh(B[k],far),w=P.gob?5:8,h=P.gob?9:5;
    return `<rect class="db" x="${a[0]-w/2}" y="${a[1]-h/2}" width="${w}" height="${h}" rx="1.5">${an("x",a[0]-w/2,b[0]-w/2)}${an("y",a[1]-h/2,b[1]-h/2)}</rect>`;};
  if(P.gob) s+=dbAt("w",0);
  else if(P.db){ if(!P.dbNear) s+=dbAt("w2",1); s+=dbAt("w",0); }
  return `<svg class="ill" viewBox="0 0 120 78" role="img" aria-label="${esc(EX[id]?.n||"Tapis de course")}">${s}</svg>`;
}

  // fusion par id : les séances déjà présentes sur le téléphone sont gardées, les réglages importés remplacent les actuels
  // bilans fusionnés par id, pauses par jour (on garde le maximum)
  async merge(v){
    const incoming=(v.sessions||[]).filter(s=>s&&s.id&&s.date&&Array.isArray(s.blocks));
    const known=new Set(S.sessions.map(s=>s.id)); const added=incoming.filter(s=>!known.has(s.id));
    S.sessions=[...S.sessions,...added].sort((a,b)=>a.date<b.date?-1:1);
    const kt=new Set(S.tests.map(t=>t.id));
    S.tests=[...S.tests,...(v.tests||[]).filter(t=>t&&t.id&&t.date&&!kt.has(t.id))].sort((a,b)=>a.date<b.date?-1:1);
    for(const [d,p] of Object.entries(v.pauses||{})){ const c=S.pauses[d]||{n:0,walk:0}; S.pauses[d]={n:Math.max(c.n,p.n||0),walk:Math.max(c.walk,p.walk||0)}; }
    if(v.settings) S.settings={...DEF,...v.settings};
    await this.saveLocal(); return added.length;
  },
  async importFile(file){ return this.merge(JSON.parse(await file.text())); },
  async addPause(field,n){
    const k=dayKey(new Date()), c=S.pauses[k]||{n:0,walk:0};
    S.pauses[k]={...c,[field]:Math.max(0,c[field]+n)}; await this.saveLocal();
  },
};

// ---------- Coach IA : proxy Cloudflare Worker (même interface que l'ancien claude.use("sample")) ----------
const COACH_KEY="creneau.coach";
function coachConf(){ try{ return JSON.parse(localStorage.getItem(COACH_KEY))||{}; }catch(e){ return {}; } }
function coachErr(res){ const e=new Error("coach "+res.status); e.code=res.status===429?"rate_limited":res.status===401?"unauthorized":"error"; return e; }
function makeSample({url,code}){
  if(!url||!code) return null;
  const base=url.replace(/\/+$/,""), headers={"Content-Type":"application/json","X-Access-Code":code};
  // sample(prompt | messages, {onText}) → {text} ; onText reçoit le texte cumulé
  const sample=async(input,opts={})=>{
    const messages=typeof input==="string"?[{role:"user",content:input}]:input;
    const res=await fetch(base+"/chat",{method:"POST",headers,body:JSON.stringify({messages})});
    if(!res.ok||!res.body) throw coachErr(res);
    const rd=res.body.getReader(), dec=new TextDecoder(); let buf="", text="";
    for(;;){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); const lines=buf.split("\n"); buf=lines.pop();
      for(const l of lines){
        if(!l.startsWith("data: ")) continue;
        const d=JSON.parse(l.slice(6)); if(d.error) throw Object.assign(new Error(d.error),{code:d.error==="rate_limited"?"rate_limited":"error"});
        if(d.text){ text+=d.text; opts.onText?.({text}); }
      }
    }
    return {text};
  };
  sample.json=async(prompt,opts={})=>{
    const res=await fetch(base+"/json",{method:"POST",headers,body:JSON.stringify({prompt,tier:opts.modelTier||"quick"})});
    if(!res.ok) throw coachErr(res);
    return res.json();
  };
  return sample;
}

// ---------- Moteur déterministe ----------
function lastBlockWith(id){
  for(let i=S.sessions.length-1;i>=0;i--){
    const b=(S.sessions[i].blocks||[]).find(b=>b.pair&&b.pair.includes(id));
    if(b) return {b,sess:S.sessions[i]};
  }
  return null;
}
// double progression : toutes les séries en haut de fourchette (et RPE ≤ 8) → +1 cran
function suggest(id){
  const e=EX[id], st=S.settings; const last=lastBlockWith(id);
  if(e.eq!=="db"){
    if(!last) return {target:e.hold?e.hold:e.r[1]-2};
    const k=last.b.pair.indexOf(id); const reps=last.b.log.map(r=>r[k]).filter(x=>x!=null);
    const base=e.hold?e.hold:e.r[1]; const hit=reps.length&&reps.every(x=>x>=base);
    return {target:e.hold?(hit?base+10:base):Math.min(base+(hit?2:0),base+4),up:hit};
  }
  if(!last) return {w:clampW(st.startW[e.tier]),target:e.r[0]+2,first:true};
  const k=last.b.pair.indexOf(id); const reps=last.b.log.map(r=>r[k]).filter(x=>x!=null);
  const w=last.b.w; const top=reps.length&&reps.every(x=>x>=e.r[1]) && (last.sess.rpe||8)<=8;
  const miss=reps.length&&reps.filter(x=>x<e.r[0]).length>=2;
  if(top && w<24) return {w:clampW(w+st.step),target:e.r[0],up:true};
  if(top && w>=24) return {w:24,target:e.r[1]+2,note:"Haltères au max : +2 reps et descente en 3 s"};
  if(miss) return {w:clampW(w-st.step),target:e.r[0],down:true};
  return {w,target:Math.min(e.r[1],(Math.max(...reps)||e.r[0])+1)};
}
function swapFor(id,zones,used){
  const e=EX[id]; if(!e.z.some(z=>zones.includes(z))) return id;
  const ok=k=>!used.has(k)&&!EX[k].z.some(z=>zones.includes(z));
  const pool=Object.keys(EX).filter(k=>EX[k].eq===e.eq&&ok(k));
  return pool.find(k=>EX[k].p===e.p)||pool[0]||(ok("deadbug")?"deadbug":"planche");
}
function countType(t){ return S.sessions.filter(s=>s.type===t).length; }
function autoType(d=new Date()){
  if(S.settings.weekend && d.getDay()===6) return "full60";
  return SEQ[S.sessions.filter(s=>SEQ.includes(s.type)).length % SEQ.length];
}
// semaine allégée : la 5e semaine active d'affilée, ou après 3 séances très dures (RPE ≥ 9) dans les 14 derniers jours
function deload(){
  const last=S.sessions.slice(-3);
  if(last.length===3 && last.every(s=>(s.rpe||0)>=9) && Date.now()-new Date(last[2].date)<14*864e5) return "fatigue";
  const cur=dayKey(weekStart(new Date()));
  const weeks=new Set(S.sessions.map(s=>dayKey(weekStart(new Date(s.date)))).filter(k=>k<cur));
  return weeks.size>0 && weeks.size%5===4 ? "cycle" : null;
}
function intensity(){
  let i=S.adj.intensite||0;
  if(deload()) i=Math.min(i,-1);
  if(S.ci.sommeil==="mal") i=Math.min(i,-1);
  if(S.ci.energie===1) i=Math.min(i,-1);
  if(S.ci.energie===3 && S.ci.sommeil==="bien" && i===0) i=1;
  return Math.max(-1,Math.min(1,i));
}
const setSec = id => EX[id].hold ? EX[id].hold*(EX[id].uni?2:1)+10 : (EX[id].uni?70:45);
function estimate(p){
  let s=0; p.items.forEach(it=>{
    if(it.kind==="run") s+=it.steps.reduce((a,x)=>a+x.sec,0);
    else if(it.kind==="text") s+=it.sec;
    else if(it.kind==="mob") s+=it.moves.reduce((a,m)=>a+m.sec,0);
    else s+=it.rounds*it.pair.reduce((a,id)=>a+setSec(id),0)+60;
  }); return Math.round(s/60);
}
function buildPlan(){
  const type=S.override||autoType(); const tpl=TPL[type]; const st=S.settings;
  const inten=intensity(); const zones=S.adj.zones||[];
  const budget=S.ci.temps || (tpl.long?60:tpl.short?15:35);
  const k=Math.floor(countType(type)/3);
  const used=new Set(); const items=[];
  const wu = tpl.long
    ? [{label:"Marche rapide",sec:180,speed:6},{label:"Footing progressif",sec:300,speed:st.easy}]
    : tpl.short ? [{label:"Marche rapide",sec:60,speed:6}]
    : [{label:"Marche rapide",sec:90,speed:6},{label:"Footing",sec:120,speed:st.easy}];
  items.push({kind:"run",title:"Échauffement tapis",steps:wu,extra:"Puis 10 rotations d'épaules à l'élastique + 10 squats à vide."});
  if(tpl.z2){
    // blocs de 5′ pour que l'ajustement au temps retire 5′ à la fois
    const n=inten<0?4:5, steps=[];
    for(let i=0;i<n;i++) steps.push({label:`Allure modérée ${i+1}/${n}`,sec:300,speed:st.z2});
    items.push({kind:"run",z2:true,title:`Endurance ${n*5}′`,steps,extra:"Tu dois pouvoir parler en phrases complètes. Si tu es essoufflé, ralentis ou incline le tapis au lieu d'accélérer."});
  }
  if(tpl.run){
    const n=inten<0?6:inten>0?10:8; const f=st.fast+(inten<0?-1:0); const steps=[];
    for(let i=0;i<n;i++){steps.push({label:`Rapide ${i+1}/${n}`,sec:60,speed:f});steps.push({label:"Récup marche",sec:60,speed:6});}
    items.push({kind:"run",title:`Fractionné ${n} × 1′/1′`,steps});
  }
  tpl.blocks.forEach(opts=>{
    const pair=opts[k%opts.length].map(id=>{const s=swapFor(id,zones,used); used.add(s); return s;});
    const rounds=Math.max(2,tpl.rounds+(inten<0?-1:0));
    const sug=pair.map(suggest);
    const dbIx=pair.findIndex(id=>EX[id].eq==="db");
    let w=dbIx>=0?sug[dbIx].w:null; if(w&&inten<0) w=clampW(w-st.step);
    items.push({kind:"pair",pair,rounds,w,sug,targets:sug.map(x=>x.target)});
  });
  if(tpl.fin){
    const n=inten<0?4:6, f=Math.min(16,st.fast+1), steps=[];
    for(let i=0;i<n;i++){steps.push({label:`Sprint ${i+1}/${n}`,sec:30,speed:f});steps.push({label:"Récup marche",sec:30,speed:6});}
    items.push({kind:"run",title:`Finisher ${n} × 30″/30″`,steps});
  }
  if(tpl.long) items.push({kind:"run",title:"Retour au calme tapis",steps:[{label:"Footing facile",sec:600,speed:st.easy},{label:"Marche",sec:120,speed:5}]});
  items.push({kind:"mob",title:"Mobilité posture",moves:tpl.short?MOB.slice(0,3):MOB});
  const p={type,title:tpl.t,items,inten,zones,deload:deload()};
  // ajustement au temps dispo : 3 tours, puis on retire des blocs depuis la fin
  const pairs=()=>p.items.filter(i=>i.kind==="pair");
  let guard=0;
  while(estimate(p)>budget && guard++<10){
    const big=pairs().find(b=>b.rounds>3);
    if(big){big.rounds--;continue;}
    const z=p.items.find(i=>i.z2&&i.steps.length>2);
    if(z){z.steps.pop();z.steps.forEach((s,i)=>s.label=`Allure modérée ${i+1}/${z.steps.length}`);z.title=`Endurance ${z.steps.length*5}′`;continue;}
    const run=p.items.find(i=>i.kind==="run"&&!i.z2&&i.steps.length>4);
    if(run){run.steps.splice(-2,2);run.title=run.title.replace(/\d+ ×/,`${run.steps.length/2} ×`);continue;}
    if(pairs().length>1){const ix=p.items.lastIndexOf(pairs().at(-1));p.items.splice(ix,1);continue;}
    break;
  }
  p.min=estimate(p); return p;
}

function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function plannedDay(d){return S.settings.days.includes(d.getDay())||(S.settings.weekend&&d.getDay()===6);}
function weekly(){
  const done=new Set(S.sessions.map(s=>dayKey(new Date(s.date))));
  const target=S.settings.days.length+(S.settings.weekend?1:0);
  const w0=weekStart(new Date()); const weeks=[];
  for(let i=7;i>=0;i--){
    const ws=new Date(w0);ws.setDate(ws.getDate()-7*i); const cells=[];let n=0;
    for(let j=0;j<7;j++){const d=new Date(ws);d.setDate(d.getDate()+j);const k=dayKey(d);const dn=done.has(k);if(dn)n++;cells.push({d,k,dn,plan:plannedDay(d)});}
    weeks.push({ws,cells,n});
  }
  // une semaine est validée dès objectif − 1 séances : un jour raté ne casse pas la série
  const need=Math.max(1,target-1);
  let streak=0; for(let i=weeks.length-2;i>=0;i--){ if(weeks[i].n>=need) streak++; else break; }
  if(weeks.at(-1).n>=need) streak++;
  return {weeks,target,need,streak};
}

function fmtMetric(m,v){ return v==null?"–":m.time?fmt(v):`${String(v).replace(".",",")}${m.u}`; }

function spark(vals){
  const pts=vals.map((v,i)=>v==null?null:[i,v]).filter(Boolean); if(!pts.length) return `<svg class="spark" viewBox="0 0 96 30"></svg>`;
  const lo=Math.min(...pts.map(p=>p[1])), hi=Math.max(...pts.map(p=>p[1])), n=Math.max(1,vals.length-1);
  const xy=([i,v])=>[4+i/n*88, hi===lo?15:26-(v-lo)/(hi-lo)*22].map(x=>x.toFixed(1));
  const c=pts.map(xy);
  return `<svg class="spark" viewBox="0 0 96 30" aria-hidden="true">${c.length>1?`<polyline points="${c.map(p=>p.join(",")).join(" ")}"/>`:""}<circle cx="${c.at(-1)[0]}" cy="${c.at(-1)[1]}" r="3"/></svg>`;
}
function bars(vals,target){
  const hi=Math.max(target,...vals,1), w=96/vals.length;
  return `<svg class="spark" viewBox="0 0 96 30" aria-hidden="true"><line x1="0" x2="96" y1="${(28-target/hi*26).toFixed(1)}" y2="${(28-target/hi*26).toFixed(1)}"/>${vals.map((v,i)=>`<rect class="${i===vals.length-1?"cur":""}" x="${(i*w+1.5).toFixed(1)}" y="${(28-v/hi*26).toFixed(1)}" width="${(w-3).toFixed(1)}" height="${(v/hi*26).toFixed(1)}" rx="1.5"/>`).join("")}</svg>`;
}

// ---------- Séance en direct ----------
function flatten(p){
  const steps=[]; let bi=0;
  p.items.forEach((it,ii)=>{
    if(it.kind==="run") it.steps.forEach((s,k)=>steps.push({kind:"run",ii,...s,title:it.title,extra:k===it.steps.length-1?it.extra:null}));
    else if(it.kind==="text") steps.push({kind:"timer",ii,label:it.title,sec:it.sec,txt:it.txt});
    else if(it.kind==="mob") it.moves.forEach(m=>steps.push({kind:"timer",ii,label:m.n,sec:m.sec,txt:m.cue,title:it.title}));
    else{
      bi++; steps.push({kind:"weight",ii,bi});
      for(let r=0;r<it.rounds;r++) it.pair.forEach((id,k)=>steps.push({kind:"set",ii,bi,r,k,id}));
    }
  });
  return steps;
}
let tick=null, wake=null, actx=null;
function beep(f=880,d=.15){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
function startPause(id){
  const r=PAUSES.find(x=>x.id===id);
  S.live={pause:id,plan:{items:[]},steps:r.moves.map(m=>({kind:"timer",ii:-1,label:m.n,sec:m.sec,txt:m.cue,title:r.t})),i:0,t0:Date.now(),left:0,val:null,done:false};
  navigator.wakeLock?.request("screen").then(w=>wake=w,()=>{});
  beep(660); clearInterval(tick); tick=setInterval(liveTick,1000); prepStep(); render();
}
async function startLive(){
  const plan=buildPlan(); const steps=flatten(plan);
  plan.items.forEach(it=>{if(it.kind==="pair") it.log=Array.from({length:it.rounds},()=>it.pair.map(()=>null));});
  S.live={plan,steps,i:0,t0:Date.now(),left:steps[0].sec||0,val:null,done:false,rpe:8,note:""};
  try{wake=await navigator.wakeLock?.request("screen");}catch(e){}

}
function prepStep(){
  const L=S.live, st=L.steps[L.i]; if(!st) return;
  if(st.kind==="run"||st.kind==="timer") L.left=st.sec;
  if(st.kind==="set"){const it=L.plan.items[st.ii]; const prev=st.r>0?it.log[st.r-1][st.k]:null; L.val=prev??it.targets[st.k];}
}
function liveTick(){
  const L=S.live; if(!L||L.done) return;
  const st=L.steps[L.i];
  if(st&&(st.kind==="run"||st.kind==="timer")){
    L.left--; if(L.left<=3&&L.left>0) beep(520,.08);
    if(L.left<=0){beep(990,.25); advance(); return;}
    const el=$("#left"); if(el) el.textContent=fmt(L.left);
  }
  const c=$("#clock"); if(c) c.textContent=fmt(Math.round((Date.now()-L.t0)/1000));
}
function advance(){
  const L=S.live, st=L.steps[L.i];
  if(st?.kind==="set"){ L.plan.items[st.ii].log[st.r][st.k]=L.val; }
  L.i++; if(L.i>=L.steps.length){L.done=true;beep(990,.4);} else prepStep();
  render();
}

function viewLive(){
  const L=S.live; const st=L.steps[L.i]; const pct=Math.round(100*L.i/L.steps.length);
  const head=`<div class="row between"><button class="btn" id="quit">Quitter</button><span class="num" id="clock" style="font-size:20px">${fmt(Math.round((Date.now()-L.t0)/1000))}</span></div><div class="progress"><i style="width:${pct}%"></i></div>`;
  if(L.done&&L.pause){
    return `${head}<div class="stage"><div class="eyebrow">Pause terminée</div><div class="what">Retour au bureau.</div>
      <button class="btn primary big" id="savepause">Compter cette pause</button></div>`;
  }
  if(L.done){
    return `${head}<div class="stage"><div class="eyebrow">Terminé</div><div class="what">Bien joué.</div>
      <div class="field"><span>Difficulté ressentie (RPE)</span><div class="rpe">${[6,7,8,9,10].map(v=>`<button class="chip" data-rpe="${v}" aria-pressed="${L.rpe===v}">${v}</button>`).join("")}</div></div>
      <label class="field"><span>Note (facultatif)</span><textarea id="lnote" placeholder="ex. élastique trop léger au face pull">${esc(L.note)}</textarea></label>
      <button class="btn primary big" id="save">Enregistrer la séance</button></div>`;
  }
  const it=L.plan.items[st.ii]; const nx=L.steps[L.i+1];
  let body="";
  if(st.kind==="run"||st.kind==="timer"){
    body=`${st.kind==="run"?`<div class="hero-ill">${illus("run")}</div>`:""}<div class="eyebrow">${esc(st.title||"Fin de séance")}</div><div class="what">${esc(st.label)}</div>
      ${st.kind==="run"?`<div class="tags"><span class="tag kg num">${st.speed} km/h</span></div>`:`<div class="muted">${esc(st.txt)}</div>`}
      <div class="big" id="left">${fmt(L.left)}</div>${st.extra?`<div class="muted">${esc(st.extra)}</div>`:""}
      <div class="row" style="flex-wrap:nowrap"><button class="btn" id="m30" style="flex:1">−30 s</button><button class="btn" id="p30" style="flex:1">+30 s</button><button class="btn primary" id="next" style="flex:2">Passer</button></div>`;
  } else if(st.kind==="weight"){
    body=`<div class="eyebrow">Bloc ${String.fromCharCode(64+st.bi)} · ${it.rounds} tours sans repos</div>
      <div class="what">${it.w?`Règle les haltères`:`Pas d'haltères`}</div>
      ${it.w?`<div class="stepper"><button data-w="-1" aria-label="Moins lourd">−</button><div class="v">${it.w}<span class="u">kg par haltère</span></div><button data-w="1" aria-label="Plus lourd">+</button></div>`:""}
      <div class="duo">${it.pair.map(id=>`<div class="thumb">${illus(id)}</div>`).join("")}</div>
      <div class="stack" style="gap:6px">${it.pair.map((id,k)=>`<div><b>${esc(EX[id].n)}</b> <span class="muted">${EX[id].eq==="band"?`· élastique ${EX[id].a}`:""}</span><div class="muted" style="font-size:13px">${esc(EX[id].cue)}</div></div>`).join("")}</div>
      <button class="btn primary big" id="next">C'est prêt</button>`;
  } else {
    const e=EX[st.id]; const isHold=!!e.hold; const tgt=it.targets[st.k];
    body=`<div class="row between"><span class="eyebrow">Bloc ${String.fromCharCode(64+st.bi)} · tour ${st.r+1}/${it.rounds} · ${st.k===0?"A":"B"}</span>${e.eq==="db"?`<span class="tag kg num">${it.w} kg</span>`:e.eq==="band"?`<span class="tag">${anchorIcon(e.a)}</span>`:""}</div>
      <div class="hero-ill">${illus(st.id)}</div>
      <div class="what">${esc(e.n)}</div><div class="muted">${esc(e.cue)} Objectif : ${tgt} ${isHold?"s":"reps"}${e.uni?" par côté":""}.</div>
      <div class="stepper"><button data-v="-1" aria-label="Moins">−</button><div class="v">${L.val}<span class="u">${isHold?"secondes":"reps faites"}${e.uni?" / côté":""}</span></div><button data-v="1" aria-label="Plus">+</button></div>
      <button class="btn primary big" id="next">Fait → ${nx?.kind==="set"&&nx.ii===st.ii?"enchaîne":"suite"}</button>`;
  }
  return `${head}<div class="stage">${body}</div><div class="next">Ensuite : <b>${esc(stepLabel(nx))}</b></div>`;
}
async function saveLive(){
  const L=S.live; const s={id:"s_"+Date.now(),date:new Date().toISOString(),type:L.plan.type,dur:Math.round((Date.now()-L.t0)/1000),
    rpe:L.rpe,note:L.note.slice(0,300),checkin:{...S.ci},
    blocks:L.plan.items.filter(i=>i.kind==="pair").map(i=>({pair:i.pair,w:i.w,log:i.log.filter(r=>r.some(x=>x!=null))}))};
  S.sessions.push(s); await store.saveSession(s);
  endLive(); S.tab="histo"; S.adj={intensite:0,zones:[],msg:""}; S.override=null; render();
  aiDebrief(s);
}
function endLive(){clearInterval(tick);tick=null;try{wake?.release();}catch(e){} wake=null;S.live=null;}

function render(){
  const app=$("#app");
  if(S.live){ app.innerHTML=`<div class="live"><div class="wrap">${viewLive()}</div></div>`; return; }
  const v={seance:viewSeance,pause:viewPause,semaine:viewSemaine,histo:viewHisto,coach:viewCoach}[S.tab]();
  const deb=S.tab==="histo"&&S.debrief?`<div class="note ai" style="margin-bottom:12px"><div class="eyebrow" style="margin-bottom:4px">Débrief du coach</div><div id="debrief" style="white-space:pre-wrap">${esc(S.debrief)}</div></div>`:"";
  app.innerHTML=`<div class="wrap">${deb}${v}</div><nav class="tabs"><div class="in">${[["seance","Séance"],["pause","Pause"],["semaine","Semaine"],["histo","Suivi"],["coach","Coach"]].map(([k,l])=>`<button data-tab="${k}" aria-current="${S.tab===k}">${ICON[k]}${l}</button>`).join("")}</div></nav>`;
}

// ---------- Événements ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const L=S.live;
  if(b.dataset.tab){S.tab=b.dataset.tab;render();window.scrollTo(0,0);if(b.dataset.focus)$("#"+b.dataset.focus)?.scrollIntoView({block:"center"});return;}
  if(b.dataset.ci){const k=b.dataset.ci,v=b.dataset.v;S.ci[k]=k==="sommeil"?v:Number(v);render();return;}
  if(b.id==="aiadj"){S.ci.txt=$("#citxt").value;aiAdjust();return;}
  if(b.id==="start"){S.ci.txt=$("#citxt")?.value||S.ci.txt;startLive();return;}
  if(b.dataset.day){const d=+b.dataset.day,ds=S.settings.days;S.settings.days=ds.includes(d)?ds.filter(x=>x!==d):[...ds,d].sort();store.saveSettings();render();return;}
  if(b.dataset.we){S.settings.weekend=!S.settings.weekend;store.saveSettings();render();return;}
  if(b.dataset.q){aiChat(b.dataset.q);return;}
  if(b.id==="exp"){store.exportFile();return;}
  if(b.dataset.pause){startPause(b.dataset.pause);return;}
  if(b.dataset.bilan){S.testForm=true;S.tab="histo";render();$("#bilan")?.scrollIntoView({block:"start"});return;}
  if(b.id==="canceltest"){S.testForm=false;render();return;}
  if(b.id==="savetest"){saveTest();return;}
  if(b.dataset.walk){store.addPause("walk",+b.dataset.walk).then(render);return;}
  if(b.id==="express"){S.override="express";S.ci.temps=null;render();window.scrollTo(0,0);return;}
  if(!L) return;
  if(b.id==="quit"){endLive();render();return;}
  if(b.id==="next"){advance();return;}
  if(b.id==="m30"){L.left=Math.max(5,L.left-30);render();return;}
  if(b.id==="p30"){L.left+=30;render();return;}
  if(b.dataset.v){L.val=Math.max(0,L.val+Number(b.dataset.v)*(EX[L.steps[L.i].id].hold?5:1));render();return;}
  if(b.dataset.w){const it=L.plan.items[L.steps[L.i].ii];it.w=clampW(it.w+Number(b.dataset.w)*S.settings.step);render();return;}
  if(b.dataset.rpe){L.rpe=+b.dataset.rpe;L.note=$("#lnote")?.value||L.note;render();return;}
  if(b.id==="save"){L.note=$("#lnote")?.value||"";saveLive();return;}
  if(b.id==="savepause"){endLive();S.tab="pause";store.addPause("n",1).then(render);return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="type"){S.override=t.value===autoType()?null:t.value;S.ci.temps=null;render();return;}
  if(t.id==="imp"&&t.files[0]){store.importFile(t.files[0]).then(n=>{S.impMsg=`Import terminé : ${n} nouvelle${n>1?"s":""} séance${n>1?"s":""}.`;},()=>{S.impMsg="Fichier illisible : rien n'a été importé.";}).then(render);return;}
  const st=S.settings;
  if(t.id==="s_step"){st.step=Math.max(.5,+t.value||2);}
  else if(t.id==="s_fast"){st.fast=Math.min(16,Math.max(6,+t.value||12));}
  else if(t.id==="s_easy"){st.easy=Math.min(14,Math.max(5,+t.value||8));}
  else if(t.id==="s_z2"){st.z2=Math.min(12,Math.max(4,+t.value||7));}
  else if(t.dataset.sw){st.startW[t.dataset.sw]=clampW(+t.value||8);}
  else return;
  store.saveSettings(); render();
});
function saveTest(){
  const t={id:"t_"+Date.now(),date:new Date().toISOString()}; let bad=null;
  for(const m of METRICS){
    const raw=$("#t_"+m.k).value.trim(); if(!raw) continue;
    let v;
    if(m.time){ const mm=raw.match(/^(\d{1,2})(?:[:'.,h ](\d{1,2}))?$/); v=mm?(+mm[1])*60+(+(mm[2]||0)):NaN; }
    else v=Number(raw.replace(",","."));
    if(!isFinite(v)||v<=0){ bad=`${m.n} : valeur invalide.`; break; }
    t[m.k]=Math.round(v*10)/10;
  }
  const err=$("#t_err");
  if(!bad && Object.keys(t).length===2) bad="Remplis au moins une mesure.";
  if(bad){ err.textContent=bad; err.hidden=false; return; }
  S.tests.push(t); S.testForm=false; store.saveLocal(); render(); $("#bilan")?.scrollIntoView({block:"start"});
}
function saveCoach(){
  const c={url:$("#c_url").value.trim(),code:$("#c_code").value.trim()};
  try{localStorage.setItem(COACH_KEY,JSON.stringify(c));}catch(e){}
  S.sample=makeSample(c); $("#c_state").textContent=S.sample?"Coach activé.":"Coach désactivé : renseigne l'adresse et le code pour l'activer.";
}
document.addEventListener("input",e=>{ if(e.target.id?.startsWith("t_")){const er=$("#t_err"); if(er) er.hidden=true;} if(e.target.id==="citxt") S.ci.txt=e.target.value; if(e.target.id==="c_url"||e.target.id==="c_code") saveCoach(); });
document.addEventListener("submit",e=>{ if(e.target.id==="chatf"){e.preventDefault();const v=$("#chatin").value;aiChat(v);} });

S.sample=makeSample(coachConf());
render();
store.init().then(render);
if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
